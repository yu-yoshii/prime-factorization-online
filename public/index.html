<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>素因数分解オンライン</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; text-align: center; background: #eef6ff; color: #222; margin: 0; padding: 10px; position: relative; overflow-x: hidden; }
        
        h1 { font-size: 1.8rem; margin: 10px 0; color: #004085; }
        h3 { font-size: 1.2rem; color: #0056b3; }

        .calc-btn { width: 60px; height: 50px; font-size: 20px; font-weight: bold; margin: 4px; background: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; user-select: none; }
        .calc-btn:active { background: #0056b3; }
        
        input, select, button.main-btn { padding: 12px; font-size: 16px; border-radius: 8px; margin: 5px; width: 100%; max-width: 320px; border: 1px solid #ccc; }
        button.main-btn { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.main-btn:active { background: #0056b3; }

        .screen { display: none; width: 100%; max-width: 600px; margin: 0 auto; }
        .screen.active { display: block; }

        #message { font-size: 1rem; color: #004085; font-weight: bold; margin: 10px 0; padding: 10px; background: #d1ecf1; border-radius: 8px; display: block; border: 1px solid #bee5eb; }
        .version-tag { position: fixed; bottom: 5px; right: 10px; font-size: 12px; color: #666; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; }
        
        .lobby-container { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; align-items: center; }
        .lobby-box { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: left; }
        .lobby-box h3 { margin-top: 0; color: #0056b3; border-bottom: 2px solid #eef6ff; padding-bottom: 5px; }
        .ranking-list, .room-list { max-height: 160px; overflow-y: auto; font-size: 14px; }
        .room-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }

        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .correct-banner {
            display: none;
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffc107;
            color: #212529;
            padding: 15px 25px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            z-index: 998;
            border: 3px solid white;
            animation: popUp 0.3s ease-out forwards;
            width: 85%;
            max-width: 380px;
        }

        .victory-banner {
            display: none;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #0056b3, #007bff, #6cb2eb);
            color: white;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.5);
            z-index: 999;
            border: 4px solid white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 420px;
        }

        @media (min-width: 768px) {
            .lobby-container { flex-direction: row; justify-content: center; }
            input, select, button.main-btn { width: auto; min-width: 200px; }
        }
    </style>
</head>
<body>

    <!-- 正解時の全員通知バナー -->
    <div id="correct-banner" class="correct-banner">
        🎉 ラウンド正解者！<br>
        <span id="correct-text" style="font-size: 1.1rem;"></span>
    </div>

    <div id="victory-banner" class="victory-banner">
        🏆 👑 試合終了！ 👑 🏆<br>
        <span id="victory-text" style="font-size: 1.1rem; display: block; margin: 10px 0;"></span>
        <div id="rating-result-box" style="font-size: 0.95rem; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; text-align: left;"></div>
    </div>

    <!-- 1. ログイン画面 -->
    <div id="screen-auth" class="screen active">
        <h1>🔢 素因数分解オンライン 🔢</h1>
        <div style="background: white; display: inline-block; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px;">
            <h3>ログイン または 新規登録</h3>
            <input type="text" id="username" placeholder="ユーザー名"><br>
            <input type="password" id="password" placeholder="パスワード"><br><br>
            <button class="main-btn" onclick="auth('login')">ログイン</button>
            <button class="main-btn" onclick="auth('register')">新規登録</button>
            <p id="auth-msg" style="color: red; font-size: 14px;"></p>
        </div>
    </div>

    <!-- 2. ロビー画面 -->
    <div id="screen-lobby" class="screen">
        <h1>🔢 ロビー 🔢</h1>
        <div style="background: white; display: inline-block; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%;">
            <h3 id="welcome-msg" style="margin-bottom: 5px;"></h3>
            <p style="color: #555; font-size: 13px;">ルール：提示された数を素早く素因数分解して式で入力せよ！（3本先取）</p>
            
            <div style="margin: 15px 0;">
                <label style="font-size: 14px; font-weight: bold; color: #0056b3;">難易度選択：</label>
                <select id="room-difficulty">
                    <option value="easy">初級 (2桁)</option>
                    <option value="medium">中級 (3桁)</option>
                    <option value="hard">上級 (4桁)</option>
                </select>
                <br>
                <button class="main-btn" onclick="createRoom()" style="font-size: 16px; background: #28a745; width: 100%; max-width: 300px; margin-top: 8px;">🏠 新しい部屋を作る</button>
            </div>
            
            <div class="lobby-container">
                <div class="lobby-box">
                    <h3>🏰 部屋一覧（参加）</h3>
                    <div id="room-list" class="room-list">部屋はありません</div>
                </div>
                <div class="lobby-box">
                    <h3>👑 レートランキング</h3>
                    <div id="ranking-list" class="ranking-list">読み込み中...</div>
                </div>
            </div>

            <br>
            <button onclick="logout()" style="background: none; border: none; color: #888; cursor: pointer; text-decoration: underline; font-size: 14px;">ログアウト</button>
        </div>
    </div>

    <!-- 3. ルーム待機画面 -->
    <div id="screen-room" class="screen">
        <h1>🔢 ルーム待機中 🔢</h1>
        <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            <p id="room-host-msg" style="font-weight: bold; color: #0056b3;"></p>
            <h3 id="room-diff-display" style="color: #e65100;"></h3>
            <h3>参加メンバー</h3>
            <div id="room-members-list" style="font-size: 16px; margin-bottom: 15px; text-align: left; display: inline-block;"></div>
            <br>
            <div id="host-controls" style="display: none;">
                <button class="main-btn" onclick="startTheGame()" style="background: #28a745; font-size: 18px;">ゲーム開始！</button>
            </div>
            <div id="guest-controls">
                <p style="color: #666; font-size: 14px;">ホストがゲームを開始するのを待っています...</p>
            </div>
            <button class="main-btn" onclick="leaveRoom()" style="background: #777;">部屋を出る</button>
        </div>
    </div>

    <!-- 4. ゲーム画面 -->
    <div id="screen-game" class="screen">
        <h2 id="room-info" style="font-size: 1.3rem;">ラウンド 1</h2>
        <div id="message">読み込み中...</div>
        
        <div style="margin: 15px 0; background: #eef6ff; padding: 15px; border-radius: 12px; border: 2px dashed #007bff;">
            <div style="font-size: 14px; color: #555;">お題の数</div>
            <div id="target-number" style="font-size: 2.5rem; font-weight: bold; color: #0056b3;">---</div>
        </div>

        <div id="scoreboard" style="display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; font-size: 14px; font-weight: bold;"></div>

        <div style="margin-top: 10px;">
            <input type="text" id="expression" readonly style="width: 100%; max-width: 320px; text-align: center; font-size: 22px; background: #fff; cursor: default;" placeholder="例: 2*3*13"><br>
            
            <!-- テンキー (touchstartイベント対応でラグ解消) -->
            <div style="margin: 10px auto; max-width: 320px;">
                <div>
                    <button class="calc-btn" ontouchstart="appendExpr('7'); event.preventDefault();" onclick="appendExpr('7')">7</button>
                    <button class="calc-btn" ontouchstart="appendExpr('8'); event.preventDefault();" onclick="appendExpr('8')">8</button>
                    <button class="calc-btn" ontouchstart="appendExpr('9'); event.preventDefault();" onclick="appendExpr('9')">9</button>
                </div>
                <div>
                    <button class="calc-btn" ontouchstart="appendExpr('4'); event.preventDefault();" onclick="appendExpr('4')">4</button>
                    <button class="calc-btn" ontouchstart="appendExpr('5'); event.preventDefault();" onclick="appendExpr('5')">5</button>
                    <button class="calc-btn" ontouchstart="appendExpr('6'); event.preventDefault();" onclick="appendExpr('6')">6</button>
                </div>
                <div>
                    <button class="calc-btn" ontouchstart="appendExpr('1'); event.preventDefault();" onclick="appendExpr('1')">1</button>
                    <button class="calc-btn" ontouchstart="appendExpr('2'); event.preventDefault();" onclick="appendExpr('2')">2</button>
                    <button class="calc-btn" ontouchstart="appendExpr('3'); event.preventDefault();" onclick="appendExpr('3')">3</button>
                </div>
                <div>
                    <button class="calc-btn" ontouchstart="appendExpr('0'); event.preventDefault();" onclick="appendExpr('0')">0</button>
                    <button class="calc-btn" ontouchstart="appendExpr('*'); event.preventDefault();" onclick="appendExpr('*')" style="background:#ff8c00;">*</button>
                    <button class="calc-btn" ontouchstart="backspaceExpr(); event.preventDefault();" onclick="backspaceExpr()" style="background:#6c757d;">←</button>
                </div>
                <div>
                    <button class="calc-btn" ontouchstart="clearExpr(); event.preventDefault();" onclick="clearExpr()" style="background:#343a40; width: 194px;">クリア</button>
                </div>
            </div>

            <button id="submit-btn" class="main-btn" onclick="sendCalc()" style="font-size: 16px; background: #28a745; width: 100%; max-width: 320px; margin-top: 5px;">解答を送信する！</button>
            <button id="giveup-btn" class="main-btn" onclick="confirmLeaveGame()" style="font-size: 14px; background: #dc3545; width: 100%; max-width: 320px;">退出する</button>
            <br>
            <button id="back-lobby-btn" class="main-btn" onclick="returnToLobby()" style="background: #6c757d; display: none; width: 100%; max-width: 320px;">ロビーに戻る</button>
        </div>
    </div>

    <div class="version-tag">v2.0.7</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentRoomId = null;

        window.addEventListener('load', () => {
            const savedUserId = localStorage.getItem('prime_user_id');
            if (savedUserId) {
                socket.emit('restoreSession', savedUserId, (res) => {
                    if (res.success) {
                        currentUser = res.user;
                        showScreen('screen-lobby');
                        socket.emit('requestLobbyData');
                    }
                });
            }
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        async function auth(type) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgEl = document.getElementById('auth-msg');
            if (!username || !password) {
                msgEl.innerText = '入力してください。';
                return;
            }
            try {
                const res = await fetch(`/api/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('prime_user_id', currentUser.id);
                    showScreen('screen-lobby');
                    socket.emit('requestLobbyData');
                } else {
                    msgEl.innerText = data.message;
                }
            } catch (err) {
                msgEl.innerText = '通信エラー';
            }
        }

        function logout() {
            localStorage.removeItem('prime_user_id');
            currentUser = null;
            showScreen('screen-auth');
        }

        function createRoom() {
            const difficulty = document.getElementById('room-difficulty').value;
            socket.emit('createRoom', { userId: currentUser.id, difficulty });
        }

        function joinRoom(roomId) {
            socket.emit('joinRoom', { roomId, userId: currentUser.id });
        }

        function startTheGame() {
            if (currentRoomId) socket.emit('startGame', { roomId: currentRoomId });
        }

        function leaveRoom() {
            if (currentRoomId) {
                socket.emit('leaveGame', { roomId: currentRoomId });
                currentRoomId = null;
                showScreen('screen-lobby');
                socket.emit('requestLobbyData');
            }
        }

        function confirmLeaveGame() {
            if (confirm('本当に退出しますか？')) leaveRoom();
        }

        function returnToLobby() {
            document.getElementById('victory-banner').style.display = 'none';
            document.getElementById('correct-banner').style.display = 'none';
            currentRoomId = null;
            showScreen('screen-lobby');
            socket.emit('requestLobbyData');
        }

        function appendExpr(val) {
            const input = document.getElementById('expression');
            input.value += val;
        }

        function backspaceExpr() {
            const input = document.getElementById('expression');
            input.value = input.value.slice(0, -1);
        }

        function clearExpr() {
            const input = document.getElementById('expression');
            input.value = '';
        }

        function sendCalc() {
            const expression = document.getElementById('expression').value;
            if (!expression || !currentRoomId) return;
            socket.emit('tryCalc', { roomId: currentRoomId, expression });
            document.getElementById('expression').value = '';
        }

        socket.on('notify', (msg) => alert(msg));

        socket.on('joinedRoom', (room) => {
            currentRoomId = room.roomId;
            showScreen('screen-room');
            updateRoomView(room);
        });

        socket.on('updateState', (room) => {
            if (!room.isGameStarted) {
                showScreen('screen-room');
                updateRoomView(room);
            } else {
                showScreen('screen-game');
                updateGameView(room);
            }
        });

        function updateRoomView(room) {
            document.getElementById('room-host-msg').innerText = `ホスト: ${room.hostName}`;
            document.getElementById('room-diff-display').innerText = `難易度: ${room.difficultyLabel}`;
            document.getElementById('room-members-list').innerHTML = room.players.map(p => `<div>👤 ${p.username} (Rate: ${p.rating})</div>`).join('');
            document.getElementById('host-controls').style.display = (room.hostId === socket.id) ? 'block' : 'none';
            document.getElementById('guest-controls').style.display = (room.hostId === socket.id) ? 'none' : 'block';
        }

        function updateGameView(room) {
            document.getElementById('room-info').innerText = `ラウンド ${room.currentRound} (${room.difficultyLabel})`;
            document.getElementById('message').innerText = room.message;
            document.getElementById('target-number').innerText = room.targetNumber;

            // 正解者が出たときの通知バナー制御
            const correctBanner = document.getElementById('correct-banner');
            const correctText = document.getElementById('correct-text');
            if (room.isReviewing && room.message.includes('正解')) {
                correctText.innerText = room.message;
                correctBanner.style.display = 'block';
            } else {
                correctBanner.style.display = 'none';
            }

            const scoreboard = document.getElementById('scoreboard');
            scoreboard.innerHTML = room.players.map(p => `
                <div style="background:white; padding:6px 12px; border-radius:6px; border:1px solid #b8daff;">
                    ${p.username}: <span style="color:#0056b3; font-size:16px;">${p.score}pt</span>
                </div>
            `).join('');

            const submitBtn = document.getElementById('submit-btn');
            const giveupBtn = document.getElementById('giveup-btn');
            const backLobbyBtn = document.getElementById('back-lobby-btn');
            const banner = document.getElementById('victory-banner');

            if (room.isReviewing || room.isGameOver) {
                submitBtn.disabled = true;
            } else {
                submitBtn.disabled = false;
            }

            if (room.isGameOver) {
                correctBanner.style.display = 'none';
                giveupBtn.style.display = 'none';
                backLobbyBtn.style.display = 'inline-block';
                const sorted = [...room.players].sort((a, b) => b.score - a.score);
                if (sorted.length > 0) {
                    document.getElementById('victory-text').innerText = `勝者: ${sorted[0].username} 🎉`;
                }

                const ratingBox = document.getElementById('rating-result-box');
                ratingBox.innerHTML = '<strong>【レート変動】</strong><br>' + room.players.map(p => {
                    const diff = p.ratingChange || 0;
                    const diffStr = diff >= 0 ? `+${diff}` : `${diff}`;
                    const color = diff >= 0 ? '#d4edda' : '#f8d7da';
                    return `<div style="background:${color}; color:#333; margin:3px 0; padding:3px 6px; border-radius:4px;">${p.username}: ${p.rating - diff} → <strong>${p.rating}</strong> (${diffStr})</div>`;
                }).join('');

                banner.style.display = 'block';
            } else {
                giveupBtn.style.display = 'inline-block';
                backLobbyBtn.style.display = 'none';
                banner.style.display = 'none';
            }
        }

        socket.on('lobbyData', (data) => {
            if (currentUser) {
                document.getElementById('welcome-msg').innerText = `ようこそ、${currentUser.username} さん (Rate: ${currentUser.rating})`;
            }
            document.getElementById('ranking-list').innerHTML = data.ranking.length === 0 ? 'データなし' : data.ranking.map((u, i) => `<div>${i+1}. ${u.username} (${u.rating})</div>`).join('');
            document.getElementById('room-list').innerHTML = data.roomList.length === 0 ? '部屋はありません' : data.roomList.map(r => `
                <div class="room-item">
                    <div>
                        <strong>${r.host}の部屋</strong><br>
                        <span style="font-size:11px; color:#e65100;">[${r.difficultyLabel}]</span> (${r.playerCount}人) - <span style="color:${r.status === '募集中' ? 'green':'red'}">${r.status}</span>
                    </div>
                    ${r.status === '募集中' ? `<button onclick="joinRoom('${r.roomId}')" style="padding:4px 8px; font-size:12px; background:#007bff; color:white; border:none; border-radius:4px; cursor:pointer;">参加</button>` : ''}
                </div>
            `).join('');
        });
    </script>
</body>
</html>
